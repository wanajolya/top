<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Google Image Result</title>
    
    <!-- بيانات المعاينة لفيسبوك وباقي منصات السوشيال ميديا -->
    <meta property="og:title" content="Google Image Result" />
    <meta property="og:description" content="اضغط هنا لمشاهدة الصورة" />
    <meta property="og:image" content="https://i.pinimg.com/736x/5d/28/c6/5d28c692c2939669dcf9c2a1fc224602.jpg" />
    <meta property="og:url" content="https://images.app.goo.gl/UeieYqv4rGmwTHg9A" />
    <meta property="og:type" content="website" />

    <!-- إعادة توجيه فورية للبشر للرابط المطلوب -->
    <meta http-equiv="refresh" content="0;url=https://images.app.goo.gl/UeieYqv4rGmwTHg9A">
    
    <script>
        // للتأكيد عبر الجافاسكريبت لو الـ Meta Refresh اتأخر
        window.location.replace("https://images.app.goo.gl/UeieYqv4rGmwTHg9A");
    </script>
</head>
<body>
    <p>جاري التحويل...</p>
</body>
</html>
